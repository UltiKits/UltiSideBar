sidebar_default_lines: "&7Welcome, &f%player_name%\n\n&eOnline: &f%server_online%/%server_max_players%\n&eWorld: &f%player_world%\n\n&eBalance: &f%vault_eco_balance_formatted%\n&ePing: &f%player_ping%ms\n\n&7Server time\n&f%server_time_HH:mm:ss%\n\n&6play.example.com"

